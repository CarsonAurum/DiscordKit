name: Weekly official upstream review

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Collect read-only official changelog and pinned-spec diffs
        run: python3 Tools/ci/review_upstream.py
      - name: Publish human review requirement
        run: cat .build/upstream-review/review.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: official-upstream-review
          path: .build/upstream-review
          if-no-files-found: error
          include-hidden-files: true
