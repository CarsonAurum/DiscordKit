name: Offline certification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Swift 6.4.1 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    env:
      SWIFTNIO_STRICT: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Ubuntu build and validation dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils ca-certificates clang curl git gnupg2 libc6-dev \
            libcurl4-openssl-dev libedit2 libgcc-13-dev libncurses-dev \
            libpython3-dev libsqlite3-0 libstdc++-13-dev libxml2-dev \
            libz3-dev pkg-config python3 tzdata unzip zlib1g-dev
      - name: Import Swift signing keys before verifying the Swiftly installer
        if: runner.os == 'Linux'
        run: |
          # setup-swift v3 verifies Swiftly before it imports any signing keys.
          # Decode compressed responses as in Swift's official signing guide.
          curl --compressed --fail --show-error --silent --location --retry 3 \
            --output "$RUNNER_TEMP/swift-signing-keys.asc" https://www.swift.org/keys/all-keys.asc
          gpg --batch --import "$RUNNER_TEMP/swift-signing-keys.asc"
          gpg --batch --list-keys E813C892820A6FA13755B268F167DF1ACF9CE069
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.4.1'
          skip-verify-signature: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Record compiler and host
        if: runner.os == 'macOS'
        run: swift --version
      - name: Build and test root
        if: runner.os == 'macOS'
        run: |
          swift build
          swift test
      - name: Test separate authoring macros and external compile fixtures
        if: runner.os == 'macOS'
        run: |
          swift test --package-path Packages/DiscordDSLMacros --explicit-target-dependency-import-check error
          python3 Tools/ci/dsl_compile_fixtures.py --repository .
      - name: Test independently adopted DSL extensions and typed injection fixtures
        if: runner.os == 'macOS'
        run: |
          swift test --package-path Packages/DiscordDSLExtensions --explicit-target-dependency-import-check error
          python3 Tools/ci/dsl_extension_fixtures.py --repository .
      - name: Test tooling, Python helpers and browser bridge
        if: runner.os == 'macOS'
        run: |
          swift test --package-path Tools/DiscordKitTools
          swift test --package-path Tools/DiscordKitLoadTests
          python3 -m unittest discover -s Tools/DiscordKitTools/scripts -p 'test_*.py'
          python3 -m unittest discover -s Tools/DiscordKitLoadTests/scripts -p 'test_*.py'
          python3 -m unittest discover -s Tools/ci -p 'test_*.py'
          node --test Browser/DiscordActivityBridge/*.test.mjs
      - name: Test independent DSL benchmark and finite offline smoke matrix
        if: runner.os == 'macOS'
        run: |
          swift test --package-path Tools/DiscordDSLBenchmarks --explicit-target-dependency-import-check error
          python3 -m unittest discover -s Tools/DiscordDSLBenchmarks/scripts -p 'test_*.py'
          mkdir -p .build/dsl-measurements
          swift run -c release --package-path Tools/DiscordDSLBenchmarks DiscordDSLBenchmarks --invocations 1000 --output .build/dsl-measurements/runtime-smoke.json
      - name: Upload offline DSL smoke measurements
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: dsl-smoke-${{ matrix.os }}
          path: .build/dsl-measurements/runtime-smoke.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Validate documentation, inventory, generation and parity
        if: runner.os == 'macOS'
        run: |
          swift run --package-path Tools/DiscordKitTools DiscordKitTools documentation audit --repository .
          swift run --package-path Tools/DiscordKitTools DiscordKitTools inventory validate --repository .
          swift run --package-path Tools/DiscordKitTools DiscordKitTools generate --check --repository .
          swift run --package-path Tools/DiscordKitTools DiscordKitTools parity check --repository .
          python3 Tools/DiscordKitTools/scripts/verify_social_catalog.py
          python3 Tools/DiscordKitTools/scripts/release_check.py graph --repository .
          # Preserve historical certification and validate current publication evidence separately.
          python3 Tools/DiscordKitTools/scripts/release_check.py report --repository . --report Docs/Release/release-report-0.14.0.json
          python3 Tools/DiscordKitTools/scripts/release_check.py report --repository . --report Docs/Release/release-report-0.15.0.json
          python3 Tools/DiscordKitTools/scripts/release_check.py report --repository . --report Docs/Release/release-report-0.15.0-final.json
          python3 Tools/DiscordKitTools/scripts/release_check.py report --repository . --report Docs/Release/semantic-logging-report.json
          python3 Tools/DiscordKitTools/scripts/release_check.py report --repository . --report Docs/Release/publication-report.json
      - name: Build independent consumers and test offline examples
        if: runner.os == 'macOS'
        env:
          CONSUMER_SCRATCH_PATH: ${{ github.workspace }}/.build/consumers
        run: |
          for example in RESTOnly GatewayBot HTTPApp CommandsApp DSLCommands DSLEvents DSLBot OAuthApp VoiceBot RPCApp ActivityHost SocialApp LoggingApp; do
            swift build --package-path "Examples/$example" --scratch-path "$CONSUMER_SCRATCH_PATH" --explicit-target-dependency-import-check error
          done
          swift test --package-path Examples/LoggingApp --scratch-path "$CONSUMER_SCRATCH_PATH"
          swift run --package-path Examples/LoggingApp --scratch-path "$CONSUMER_SCRATCH_PATH"
          swift test --package-path Examples/CommandsApp --scratch-path "$CONSUMER_SCRATCH_PATH"
          swift test --package-path Examples/DSLCommands --scratch-path "$CONSUMER_SCRATCH_PATH"
          swift test --package-path Examples/DSLEvents --scratch-path "$CONSUMER_SCRATCH_PATH"
          swift test --package-path Examples/DSLBot --scratch-path "$CONSUMER_SCRATCH_PATH"
          swift test --package-path Examples/ActivityHost --scratch-path "$CONSUMER_SCRATCH_PATH"
          swift run --package-path Examples/CommandsApp --scratch-path "$CONSUMER_SCRATCH_PATH"
          swift run --package-path Examples/DSLCommands --scratch-path "$CONSUMER_SCRATCH_PATH" DSLCommands --offline
          swift run --package-path Examples/DSLEvents --scratch-path "$CONSUMER_SCRATCH_PATH"
          swift run --package-path Examples/DSLBot --scratch-path "$CONSUMER_SCRATCH_PATH"
          swift run --package-path Examples/VoiceBot --scratch-path "$CONSUMER_SCRATCH_PATH" VoiceBot
          swift run --package-path Examples/SocialApp --scratch-path "$CONSUMER_SCRATCH_PATH"
      - name: Compare scoped public API and convert all public DocC modules
        if: runner.os == 'macOS'
        run: |
          swift package dump-symbol-graph --minimum-access-level public
          python3 Tools/ci/curate_docc.py --check
          python3 Tools/ci/documentation_examples.py
          python3 Tools/DiscordKitTools/scripts/api_baseline.py snapshot --repository . --symbolgraphs .build/out/symbolgraph --version 0.20.0 --output .build/current-api.json
          python3 Tools/DiscordKitTools/scripts/api_baseline.py check --baseline Docs/Release/api-baseline.json --candidate .build/current-api.json --version 0.20.0
          python3 Tools/DiscordKitTools/scripts/api_baseline.py check --baseline Docs/Release/api-baseline-0.15.0.json --candidate .build/current-api.json --version 0.20.0
          python3 Tools/DiscordKitTools/scripts/api_baseline.py check --baseline Docs/Release/api-baseline-0.16.0.json --candidate .build/current-api.json --version 0.20.0
          python3 Tools/DiscordKitTools/scripts/api_baseline.py check --baseline Docs/Release/api-baseline-0.17.0.json --candidate .build/current-api.json --version 0.20.0
          python3 Tools/DiscordKitTools/scripts/api_baseline.py check --baseline Docs/Release/api-baseline-0.18.0.json --candidate .build/current-api.json --version 0.20.0
          python3 Tools/DiscordKitTools/scripts/api_baseline.py check --baseline Docs/Release/api-baseline-0.19.0.json --candidate .build/current-api.json --version 0.20.0
          python3 Tools/ci/build_docc.py
          swift package --package-path Packages/DiscordDSLMacros dump-symbol-graph --minimum-access-level public
          python3 Tools/ci/curate_docc.py --repository Packages/DiscordDSLMacros --symbolgraphs Packages/DiscordDSLMacros/.build/out/symbolgraph --check
          python3 Tools/ci/build_docc.py --repository Packages/DiscordDSLMacros --symbolgraphs Packages/DiscordDSLMacros/.build/out/symbolgraph --output .build/documentation-macros
          python3 Tools/DiscordKitTools/scripts/api_baseline.py snapshot --repository . --authoring-package Packages/DiscordDSLMacros --symbolgraphs Packages/DiscordDSLMacros/.build/out/symbolgraph --version 0.15.0 --output .build/current-macros-api.json
          python3 Tools/DiscordKitTools/scripts/api_baseline.py check --baseline Docs/Release/api-baseline-macros-0.15.0.json --candidate .build/current-macros-api.json --version 0.15.0
          swift package --package-path Packages/DiscordDSLExtensions dump-symbol-graph --minimum-access-level public
          python3 Tools/ci/curate_docc.py --repository Packages/DiscordDSLExtensions --symbolgraphs Packages/DiscordDSLExtensions/.build/out/symbolgraph --check
          python3 Tools/ci/build_docc.py --repository Packages/DiscordDSLExtensions --symbolgraphs Packages/DiscordDSLExtensions/.build/out/symbolgraph --output .build/documentation-extensions
          python3 Tools/DiscordKitTools/scripts/api_baseline.py snapshot --repository . --authoring-package Packages/DiscordDSLExtensions --symbolgraphs Packages/DiscordDSLExtensions/.build/out/symbolgraph --version 0.15.0 --output .build/current-extensions-api.json
          python3 Tools/DiscordKitTools/scripts/api_baseline.py check --baseline Docs/Release/api-baseline-extensions-0.15.0.json --candidate .build/current-extensions-api.json --version 0.15.0
      - name: Upload DocC archives and API evidence
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: public-documentation-and-api
          path: |
            .build/documentation
            .build/current-api.json
            .build/documentation-macros
            .build/current-macros-api.json
            .build/documentation-extensions
            .build/current-extensions-api.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Verify Ubuntu host, compiler and native target
        if: runner.os == 'Linux'
        run: python3 Tools/ci/linux_ci.py --stage preflight
      - name: Build and test root
        if: runner.os == 'Linux'
        run: python3 Tools/ci/linux_ci.py --stage root
      - name: Test authoring packages and external compile fixtures
        if: runner.os == 'Linux'
        run: python3 Tools/ci/linux_ci.py --stage authoring
      - name: Test tooling, Python helpers and browser bridge
        if: runner.os == 'Linux'
        run: python3 Tools/ci/linux_ci.py --stage tooling
      - name: Test DSL benchmark and finite offline smoke matrix
        if: runner.os == 'Linux'
        run: python3 Tools/ci/linux_ci.py --stage benchmarks
      - name: Validate documentation, inventory, generation and parity
        if: runner.os == 'Linux'
        run: python3 Tools/ci/linux_ci.py --stage audit
      - name: Build independent consumers and test offline examples
        if: runner.os == 'Linux'
        run: python3 Tools/ci/linux_ci.py --stage consumers
      - name: Build optimized root, macro and extension packages
        if: runner.os == 'Linux'
        run: python3 Tools/ci/linux_ci.py --stage release
      - name: Verify tracked generated source and dependency pins remain unchanged
        run: git diff --exit-code
      - name: Package checked Linux source
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        run: python3 Tools/ci/package_source.py --repository . --output .build/packages
      - name: Upload Ubuntu logs and host evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/linux-ci
            .build/dsl-measurements/runtime-smoke.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      - name: Upload Linux SwiftPM source bundle
        if: success() && runner.os == 'Linux' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: DiscordKit-linux-source-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/packages/*
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

  maintenance:
    name: Upstream maintenance review freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require a current upstream review for certification
        run: python3 Tools/DiscordKitTools/scripts/release_check.py maintenance --repository . --record Docs/Release/maintenance.json

  apple-compilation:
    name: Apple minima / device and simulator modules
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.4.1'
      - name: Record compiler and Xcode
        run: |
          swift --version
          swiftc --version
          xcodebuild -version
      - name: Emit selected modules with installed Xcode SDKs
        run: python3 Tools/ci/compile_apple.py
      - uses: actions/upload-artifact@v7
        with:
          name: apple-selected-module-compilation
          path: .build/apple-compile.json
          if-no-files-found: error
          include-hidden-files: true

  infrastructure-gates:
    name: Unverified platform and access gates
    runs-on: ubuntu-24.04
    steps:
      - name: Publish excluded qualification scope
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'REPORT'
          Windows and Android require the separately dispatched platform workflow and configured self-hosted runners. Until actual results are reviewed, these hosts remain unverified.

          Apple device/simulator jobs compile selected modules only. Physical devices, native routing, minimum-OS runtime, authorized Discord, independent crypto review and fleet capacity remain separate gates. Live REST smoke is manual and read-only. No job in this workflow receives Discord credentials.
          REPORT
